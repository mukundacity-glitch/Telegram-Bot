name: FPL VORTEX Telegram Daily
on:
  push:
    branches: [main]
    paths:
      - 'outbox/**'
      - 'vortex/**'
      - 'tests/**'
      - 'assets/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  # Eastern heartbeat, scheduled in America/New_York itself.
  # ``timezone`` is an IANA zone, so the tz database applies EST/EDT. Never
  # hand-convert to UTC: a fixed UTC pair drifts by an hour at each DST change.
  # 35 ticks/day, every 30 minutes from 05:43 to 22:43 ET, so no editorial
  # slot is ever more than half an hour late and none is scheduled below the
  # 05:30 opening or after the 23:00 close. The Python dispatcher independently
  # re-checks the 05:30-23:00 America/New_York window at execution time.
  schedule:
    - cron: '43 5-22 * * *'
      timezone: "America/New_York"
    - cron: '13 6-22 * * *'
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      edition:
        description: 'Generate and publish one verified graphic to Telegram and Discord now'
        type: choice
        required: true
        default: vortex-captain
        options:
          - four-midfielders
          - form-minutes-targets
          - rank-booster
          - fixture-targets
          - captain-differential
          - market-verdict
          - four-team-targets
          - squad-surgery
          - transfer-market-team-news
          - availability-transfer-decisions
          - vortex-captain
          - deadline-watch
          - confirmed-price-changes
          - value-board
          - start-bench-board
          - captaincy-comparison
          - market-trends-next-five
          - final-gameweek-news
permissions:
  contents: read
jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout FPL VORTEX
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q vortex tests
      - name: Validate all graphics and scheduling
        run: python -m pytest -q
      - name: Read-only verification of configured Telegram destination
        if: github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c 'from vortex.telegram import TelegramClient; TelegramClient().verify_destination()'
      - name: Read-only live Day 3 + FPL Core source-to-forecast audit
        if: github.event_name == 'pull_request'
        timeout-minutes: 7
        run: python -m vortex.editorial_live_model
      - name: Render real FPL BUY / SELL previews without publishing
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python -m vortex.preview_posts
      - name: Upload short-lived BUY / SELL preview files
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fpl-vortex-buy-sell-previews-${{ github.run_id }}
          path: output/pr-preview/*
          if-no-files-found: ignore
          retention-days: 5
  publish:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[FPL-AUTONOMOUS]') || contains(github.event.head_commit.message, '[FPL-OUTBOX]') || contains(github.event.head_commit.message, '[FPL-COMBINE-MIDS]') || contains(github.event.head_commit.message, '[FPL-MANUAL-PUBLISH]') || contains(github.event.head_commit.message, '[FPL-AUTO-REPAIR]'))) }}
    permissions:
      contents: write
    concurrency:
      group: fpl-vortex-telegram-single-workflow
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout isolated newest receipts and queued art
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install renderer dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify publishing and duplicate contracts
        if: ${{ github.event_name != 'schedule' }}
        run: python -m pytest -q
      - name: Generate and deliver the due content queue
        timeout-minutes: 45
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # A deliberate manual dispatch bypasses the scheduled ET window.
          # Scheduled jobs and ordinary push publishers retain the normal guard.
          FPL_MANUAL_PUBLISH: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[FPL-MANUAL-PUBLISH]') }}
          FPL_PUBLISH_WINDOW_ENFORCED: ${{ !(github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[FPL-MANUAL-PUBLISH]')) }}
          MANUAL_EDITION: ${{ inputs.edition || 'vortex-captain' }}
          FPL_ENRICHED_VISUALS_ENABLED: 'true'
          DUAL_PUBLISH_ENABLED: 'true'
          FPL_PORTED_TASKS_ENABLED: 'false'
          FPL_SEMANTIC_DEDUP_ENABLED: 'true'
          UNIFIED_NEWS_ENABLED: 'true'
          MAX_NEWS_PER_RUN: '1'
          FPL_TELEGRAM_HANDLE: ${{ vars.FPL_TELEGRAM_HANDLE || '@FPLVortexDailyBot' }}
          FPL_DISCORD_HANDLE: ${{ vars.FPL_DISCORD_HANDLE || '@fplvortex' }}
          FPL_YOUTUBE_HANDLE: ${{ vars.FPL_YOUTUBE_HANDLE || 'FPLVORTEX' }}
          FPL_X_HANDLE: ${{ vars.FPL_X_HANDLE || 'FPLVORTEXM' }}
          FPL_EDITORIAL_MODEL_URL: ${{ vars.FPL_EDITORIAL_MODEL_URL || '' }}
          FPL_XPTS_SNAPSHOT_URL: ${{ vars.FPL_XPTS_SNAPSHOT_URL || '' }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SCHEDULED_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$FPL_MANUAL_PUBLISH" = 'true' ]; then
            python -m vortex.autonomous_runner --manual --edition "$MANUAL_EDITION"
          else
            python -m vortex.scheduled_dispatch
          fi
      - name: Archive graphic and confirmed receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-vortex-${{ github.run_id }}
          path: |
            outbox/assets/*.png
            state/chatgpt_deliveries.json
            state/chatgpt_outbox_status.json
            state/missing_portraits.json
            state/autonomous_editions.json
            state/scheduled_dispatch_status.json
            state/publishing_audit.json
            state/scheduled_legacy_attempts.json
            state/deliveries.json
            state/news_deliveries.json
            output/autonomous-audit.json
            output/news/*.png
            output/*.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve both-platform delivery receipts before any retry
        if: always()
        run: |
          git config user.name 'FPL VORTEX Publisher'
          git config user.email 'fpl-vortex-bot@users.noreply.github.com'
          for file in state/*.json outbox/*.json outbox/assets/*.png; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save autonomous source baselines, editions and platform receipts [skip ci]'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Receipt push race: rebase the receipt commit on newest main."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::Receipt reconciliation needed; retain archived receipts before replay'
              exit 1
            fi
          done
          exit 1
