name: FPL VORTEX Telegram Daily
on:
  push:
    branches: [main]
    paths: ['outbox/**', '.github/workflows/telegram-daily.yml']
  schedule:
    - cron: '15,45 5-19 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      slot:
        description: Deliver queued ChatGPT graphics to both platforms with receipts
        default: outbox
        required: true
        type: choice
        options: [outbox]
permissions:
  contents: write
concurrency:
  group: fpl-vortex-telegram-single-workflow
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event_name != 'push' || (contains(github.event.head_commit.message, '[FPL-OUTBOX]') || contains(github.event.head_commit.message, '[FPL-COMBINE-MIDS]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout isolated newest receipts and queued art
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install renderer dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify publishing and duplicate contracts
        run: python -m pytest -q
      - name: Update original four-midfielder posts in place
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[FPL-COMBINE-MIDS]') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FPL_PUBLISH_WINDOW_ENFORCED: 'true'
        run: python -m vortex.combine_midfielder_posts
      - name: Publish ONE fresh ChatGPT edition to BOTH platforms
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FPL_PUBLISH_WINDOW_ENFORCED: 'true'
        run: python -m vortex.outbox
      - name: Archive graphic and confirmed receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-vortex-${{ github.run_id }}
          path: |
            outbox/assets/*.png
            state/chatgpt_deliveries.json
            state/chatgpt_outbox_status.json
            state/missing_portraits.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve both-platform delivery receipts before any retry
        if: always()
        run: |
          git config user.name 'FPL VORTEX Publisher'
          git config user.email 'fpl-vortex-bot@users.noreply.github.com'
          for file in state/chatgpt_deliveries.json state/chatgpt_outbox_status.json state/missing_portraits.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save ChatGPT cross-platform delivery receipts [skip ci]'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Receipt push race: rebase the receipt commit on newest main."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::Receipt reconciliation needed; retain archived receipts before replay'
              exit 1
            fi
          done
          exit 1
