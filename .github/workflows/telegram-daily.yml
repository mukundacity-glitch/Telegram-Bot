name: FPL VORTEX Telegram Daily

on:
  schedule:
    - cron: '30 6 * * *'
      timezone: America/New_York
    - cron: '0 7 * * *'
      timezone: America/New_York
    - cron: '0 8 * * *'
      timezone: America/New_York
    - cron: '0 9 * * *'
      timezone: America/New_York
    - cron: '0 10 * * *'
      timezone: America/New_York
    - cron: '0 11 * * *'
      timezone: America/New_York
    - cron: '0 12 * * *'
      timezone: America/New_York
    - cron: '0 14 * * *'
      timezone: America/New_York
    - cron: '0 15 * * *'
      timezone: America/New_York
    - cron: '0 16 * * *'
      timezone: America/New_York
    - cron: '30 17 * * *'
      timezone: America/New_York
    - cron: '30 18 * * *'
      timezone: America/New_York
    - cron: '0 20 * * *'
      timezone: America/New_York
    # Backup triggers check the same day for a missed/failed delivery.
    - cron: '45 6 * * *'
      timezone: America/New_York
    - cron: '15 7 * * *'
      timezone: America/New_York
    - cron: '15 8 * * *'
      timezone: America/New_York
    - cron: '15 9 * * *'
      timezone: America/New_York
    - cron: '15 10 * * *'
      timezone: America/New_York
    - cron: '15 11 * * *'
      timezone: America/New_York
    - cron: '15 12 * * *'
      timezone: America/New_York
    - cron: '15 14 * * *'
      timezone: America/New_York
    - cron: '15 15 * * *'
      timezone: America/New_York
    - cron: '15 16 * * *'
      timezone: America/New_York
    - cron: '45 17 * * *'
      timezone: America/New_York
    - cron: '45 18 * * *'
      timezone: America/New_York
    - cron: '15 20 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      slot:
        description: 'Scheduled posts run automatically. Manual auto does not send a test or duplicate post.'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - audit-news
          - discover
          - elite
          - comparison
          - preview
          - preview-news
          - preview-transfer
          - preview-prices
          - preview-captaincy
          - preview-review
          - preview-elite
          - preview-evening
          - preview-buy
          - preview-sell
          - preview-projections
          - preview-team_analysis
          - preview-transfer_suggestions
          - news
          - prices
          - transfer
          - captaincy
          - review
          - evening
          - buy
          - sell
          - projections
          - team_analysis
          - transfer_suggestions

permissions:
  contents: write

concurrency:
  group: fpl-vortex-telegram-single-workflow
  cancel-in-progress: false

jobs:
  publish:
    # Scheduled publishing is ON. To stop all posts, disable this workflow in GitHub Actions.
    # Do not rely on a stale PUBLISH_ENABLED variable that can silently skip cron runs.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout isolated Telegram-Bot repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install free renderer dependencies
        run: python -m pip install -r requirements.txt

      - name: Run validation tests
        run: python -m pytest -q

      - name: Deliver existing graphic (Telegram; Discord opt-in)
        id: deliver
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.slot == 'audit-news') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Optional: absent key means no bookmaker projections (N/A, never guessed).
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DUAL_PUBLISH_ENABLED: ${{ vars.DUAL_PUBLISH_ENABLED || 'false' }}
          SCHEDULED_CRON: ${{ github.event.schedule }}
          # A cron trigger must always enter the automatic, gameweek-aware dispatcher.
          # Manual input never changes a scheduled run.
          REQUESTED_SLOT: ${{ github.event_name == 'schedule' && 'auto' || inputs.slot || 'auto' }}
        run: |
          python -m vortex.bot --slot "$REQUESTED_SLOT"

      - name: Audit unified news without live posting or changing state
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.slot == 'audit-news' }}
        run: python -m vortex.unified_runner --dry-run

      - name: Publish new FPL/RSS news to both platforms (cutover opt-in)
        if: ${{ github.event_name == 'schedule' && vars.UNIFIED_NEWS_ENABLED == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          UNIFIED_NEWS_ENABLED: 'true'
          NEWS_BASE_HASHTAGS: ${{ vars.NEWS_BASE_HASHTAGS || 'FPL,FPLVortex' }}
          MAX_NEWS_PER_RUN: ${{ vars.MAX_NEWS_PER_RUN || '2' }}
        run: python -m vortex.unified_runner

      - name: Save newest PNG as short-lived artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-vortex-${{ github.run_id }}
          path: output/*.png
          if-no-files-found: ignore
          retention-days: 2

      - name: Preserve both-platform delivery receipts even after partial failure
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- state/prices.json state/deliveries.json state/news_baseline.json state/news_pending.json state/news_seen.json state/news_deliveries.json)" ]; then
            echo "No new state to commit."
            exit 0
          fi
          git config user.name 'FPL VORTEX Telegram Bot'
          git config user.email 'fpl-vortex-bot@users.noreply.github.com'
          git add state/prices.json state/deliveries.json state/news_baseline.json state/news_pending.json state/news_seen.json state/news_deliveries.json
          git commit -m 'Update shared delivery receipts and official snapshots [skip ci]'
          git push origin HEAD:${{ github.ref_name }}