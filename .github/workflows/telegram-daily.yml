name: FPL VORTEX Telegram Daily

on:
  schedule:
    - cron: '30 6 * * *'
      timezone: America/New_York
    - cron: '0 7 * * *'
      timezone: America/New_York
    - cron: '0 8 * * *'
      timezone: America/New_York
    - cron: '0 9 * * *'
      timezone: America/New_York
    - cron: '0 10 * * *'
      timezone: America/New_York
    - cron: '0 11 * * *'
      timezone: America/New_York
    - cron: '0 12 * * *'
      timezone: America/New_York
    - cron: '0 14 * * *'
      timezone: America/New_York
    - cron: '0 15 * * *'
      timezone: America/New_York
    - cron: '0 16 * * *'
      timezone: America/New_York
    - cron: '30 17 * * *'
      timezone: America/New_York
    - cron: '30 18 * * *'
      timezone: America/New_York
    - cron: '0 20 * * *'
      timezone: America/New_York
    # Backup triggers check the same day for a missed/failed delivery.
    - cron: '45 6 * * *'
      timezone: America/New_York
    - cron: '15 7 * * *'
      timezone: America/New_York
    - cron: '15 8 * * *'
      timezone: America/New_York
    - cron: '15 9 * * *'
      timezone: America/New_York
    - cron: '15 10 * * *'
      timezone: America/New_York
    - cron: '15 11 * * *'
      timezone: America/New_York
    - cron: '15 12 * * *'
      timezone: America/New_York
    - cron: '15 14 * * *'
      timezone: America/New_York
    - cron: '15 15 * * *'
      timezone: America/New_York
    - cron: '15 16 * * *'
      timezone: America/New_York
    - cron: '45 17 * * *'
      timezone: America/New_York
    - cron: '45 18 * * *'
      timezone: America/New_York
    - cron: '15 20 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      slot:
        description: 'Scheduled posts run automatically. Manual auto does not send a test or duplicate post.'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - discover
          - elite
          - comparison
          - preview
          - preview-news
          - preview-transfer
          - preview-prices
          - preview-captaincy
          - preview-review
          - preview-elite
          - preview-evening
          - preview-buy
          - preview-sell
          - preview-projections
          - preview-team_analysis
          - preview-transfer_suggestions
          - news
          - prices
          - transfer
          - captaincy
          - review
          - evening
          - buy
          - sell
          - projections
          - team_analysis
          - transfer_suggestions

permissions:
  contents: write

concurrency:
  group: fpl-vortex-telegram-single-workflow
  cancel-in-progress: false

jobs:
  publish:
    # Scheduled publishing is ON. To stop all posts, disable this workflow in GitHub Actions.
    # Do not rely on a stale PUBLISH_ENABLED variable that can silently skip cron runs.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout isolated Telegram-Bot repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install free renderer dependencies
        run: python -m pip install -r requirements.txt

      - name: Run validation tests
        run: python -m pytest -q

      - name: Deliver to Telegram
        id: deliver
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Optional: absent key means no bookmaker projections (N/A, never guessed).
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULED_CRON: ${{ github.event.schedule }}
          # A cron trigger must always enter the automatic, gameweek-aware dispatcher.
          # Manual input never changes a scheduled run.
          REQUESTED_SLOT: ${{ github.event_name == 'schedule' && 'auto' || inputs.slot || 'auto' }}
        run: |
          python -m vortex.bot --slot "$REQUESTED_SLOT"

      - name: Save newest PNG as short-lived artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-vortex-${{ github.run_id }}
          path: output/*.png
          if-no-files-found: ignore
          retention-days: 2

      - name: Preserve delivery dedup and official price baseline
        if: success()
        run: |
          if [ -z "$(git status --porcelain -- state/prices.json state/deliveries.json)" ]; then
            echo "No new state to commit."
            exit 0
          fi
          git config user.name 'FPL VORTEX Telegram Bot'
          git config user.email 'fpl-vortex-bot@users.noreply.github.com'
          git add state/prices.json state/deliveries.json
          git commit -m 'Update Telegram delivery state [skip ci]'
          git push origin HEAD:${{ github.ref_name }}