  workflow_dispatch:
    inputs:
      slot:
        description: Generate and publish, audit all editions without posting, or retry the queue
        default: autonomous
        required: true
        type: choice
        options: [autonomous, audit, news, outbox]
      edition:
        description: Optional single additional edition for a real manual production run
        required: false
        type: string
        default: vortex-captain
permissions:
  contents: write
concurrency:
  group: fpl-vortex-telegram-single-workflow
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event_name != 'push' || (contains(github.event.head_commit.message, '[FPL-AUTONOMOUS]') || contains(github.event.head_commit.message, '[FPL-OUTBOX]') || contains(github.event.head_commit.message, '[FPL-COMBINE-MIDS]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout isolated newest receipts and queued art
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install renderer dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify publishing and duplicate contracts
        if: ${{ github.event_name != 'schedule' }}
        run: python -m pytest -q
      - name: Generate and deliver from GitHub; preserve separate original news lane
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FPL_PUBLISH_WINDOW_ENFORCED: 'true'
          FPL_ENRICHED_VISUALS_ENABLED: 'true'
          DUAL_PUBLISH_ENABLED: 'true'
          FPL_PORTED_TASKS_ENABLED: 'false'
          FPL_SEMANTIC_DEDUP_ENABLED: 'true'
          UNIFIED_NEWS_ENABLED: 'true'
          MAX_NEWS_PER_RUN: '1'
          FPL_TELEGRAM_HANDLE: ${{ vars.FPL_TELEGRAM_HANDLE || '@FPLVortexDailyBot' }}
          FPL_DISCORD_HANDLE: ${{ vars.FPL_DISCORD_HANDLE || '@fplvortex' }}
          FPL_YOUTUBE_HANDLE: ${{ vars.FPL_YOUTUBE_HANDLE || 'FPLVORTEX' }}
          FPL_X_HANDLE: ${{ vars.FPL_X_HANDLE || 'FPLVORTEXM' }}
          FPL_EDITORIAL_MODEL_URL: ${{ vars.FPL_EDITORIAL_MODEL_URL || '' }}
          FPL_XPTS_SNAPSHOT_URL: ${{ vars.FPL_XPTS_SNAPSHOT_URL || '' }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SCHEDULED_CRON: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.slot || 'autonomous' }}
          REQUESTED_EDITION: ${{ inputs.edition || 'vortex-captain' }}
        run: |
          if [ "$REQUESTED_MODE" = 'audit' ]; then
            python -m vortex.autonomous_runner --audit-all
          elif [ "$REQUESTED_MODE" = 'outbox' ]; then
            python -m vortex.outbox
          elif [ "$REQUESTED_MODE" = 'news' ]; then
            python -m vortex.unified_runner
          elif [ "$EVENT_NAME" = 'schedule' ]; then
            case "$SCHEDULED_CRON" in
              '50 '*) python -m vortex.outbox ;;
              *) python -m vortex.autonomous_runner ;;
            esac
          else
            python -m vortex.autonomous_runner --edition "$REQUESTED_EDITION"
          fi
      - name: Archive graphic and confirmed receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-vortex-${{ github.run_id }}
          path: |
            outbox/assets/*.png
            state/chatgpt_deliveries.json
            state/chatgpt_outbox_status.json
            state/missing_portraits.json
            state/autonomous_editions.json
            output/autonomous-audit.json
            output/news/*.png
            output/*.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve both-platform delivery receipts before any retry
        if: always()
        run: |
          git config user.name 'FPL VORTEX Publisher'
          git config user.email 'fpl-vortex-bot@users.noreply.github.com'
          for file in state/*.json outbox/*.json outbox/assets/*.png; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save autonomous source baselines, editions and platform receipts [skip ci]'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Receipt push race: rebase the receipt commit on newest main."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::Receipt reconciliation needed; retain archived receipts before replay'
              exit 1
            fi
          done
          exit 1
