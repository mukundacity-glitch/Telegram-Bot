name: FPL VORTEX Graphics Validation

on:
  push:
    branches: [main]
    paths:
      - 'vortex/**'
      - 'tests/**'
      - 'assets/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout FPL VORTEX
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q vortex tests
      - name: Validate all graphics and scheduling
        run: python -m pytest -q
