name: FPL VORTEX Graphics Validation

on:
  push:
    branches: [main]
    paths:
      - 'vortex/**'
      - 'tests/**'
      - 'assets/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout FPL VORTEX
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q vortex tests
      - name: Validate all graphics and scheduling
        run: python -m pytest -q
      - name: Read-only live Day 3 + FPL Core source-to-forecast audit
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 7
        run: python -m vortex.editorial_live_model
      - name: Render real FPL BUY / SELL previews without publishing
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python -m vortex.preview_posts
      - name: Upload short-lived BUY / SELL preview files
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fpl-vortex-buy-sell-previews-${{ github.run_id }}
          path: output/pr-preview/*
          if-no-files-found: ignore
          retention-days: 5
